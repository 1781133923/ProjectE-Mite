plugins {
    id 'fml-loom' version '0.1.local'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/projecte.accesswidener")
    mergedMinecraftJar()
    setFML(new File("X:\\MITEmoddev\\1.6.4-MITE-HDS_FMLv3.4.3.jar"))
    mods {
        "ProjectE" {
            sourceSet sourceSets.main
        }
    }

}

runClient {
    args("--username", "ken666", "--session", "a.a.a.a", "--width", 854, "--height", 480)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.fmlMCPMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation files(loom.getFML().toPath())
    implementation files("X:\\MITEmoddev\\RustedIronCore-1.5.5.jar")
    // Standard client-initialization hook (defer renderer registration until
    // after Minecraft.startGame(), see ProjectE.onInitialize).
    // Optional pinyin search for the transmutation table (PinIn-Lib).
    implementation files("libs/pinin-lib-1.6.0.jar")
    // Real Baubles API (replaces the bundled copy that shadowed the mod).
    implementation files("libs/baubles-1.1.2.jar")
    // Libraries bundled in the 1.6.4-MITE-HDS runtime (required by EMI)
    implementation files("libs/gson.jar")
    implementation files("libs/commons-lang3.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fml.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {

}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
